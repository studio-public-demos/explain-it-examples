<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explain It — Example Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Spline+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  Static Public Examples deck viewer — presentation follows Studio Web "Explore Examples"
  (DeckRenderer) conventions, implemented in plain static HTML/CSS driven ONLY by the
  deck's own postMessage protocol. It does NOT copy buildDeckHtml/the React renderer, makes
  NO production/API/share calls, requires no auth.

  The visual deck + its certified in-deck controls (progress bar, prev/play/next, narration,
  scene counter) are the self-contained deck-content.html (certified-renderer output) running
  in STANDALONE mode inside a sandboxed iframe. This viewer adds the outer Explore Examples
  conventions the platform wraps around it: title bar, a Replay action, a completion overlay
  (closure + "N scenes completed" + Replay), paper/Fraunces typography, responsive frame,
  and loading/error treatment. Local per-scene audio is synced to deck:sceneChange.
-->
<style>
  :root{
    --paper:#f4efe6;--paper-2:#ede6d8;--ink:#23201b;--ink-soft:#5d564a;
    --terra:#c9603f;--teal:#2f7d77;--line:#cbbfa9;--shadow:rgba(40,32,20,.18);
    --overlay:#1b2430;--overlay-ink:#F5F7FA;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--paper);color:var(--ink);font-family:"Spline Sans",system-ui,sans-serif;display:flex;flex-direction:column;height:100svh;overflow:hidden;background-image:radial-gradient(circle at 18% 20%,rgba(201,96,63,.06),transparent 40%),radial-gradient(circle at 82% 78%,rgba(47,125,119,.06),transparent 42%)}
  .topbar{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);flex:0 0 auto;background:rgba(244,239,230,.9);backdrop-filter:saturate(1.1) blur(4px)}
  .topbar .back{color:var(--terra);text-decoration:none;font-weight:600;font-size:13px;white-space:nowrap}
  .topbar .meta{flex:1;min-width:0}
  .topbar .kicker{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--terra);opacity:.65;font-weight:600}
  .topbar .title{font-family:"Fraunces",Georgia,serif;font-weight:500;font-size:18px;color:var(--ink);line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stage-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:20px;position:relative}
  .deck-frame{position:relative;width:min(100%,1200px);aspect-ratio:16/9;max-height:100%;background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 70px -30px var(--shadow),0 1px 0 rgba(255,255,255,.5) inset;overflow:hidden}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--paper)}
  .actionbar{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:10px;padding:10px;border-top:1px solid var(--line)}
  .act{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:8px 16px;border:1px solid var(--line);border-radius:10px;background:var(--paper-2);color:var(--ink);font:inherit;font-size:14px;font-weight:500;cursor:pointer;transition:.18s}
  .act:hover{background:var(--terra);color:#fff;border-color:var(--terra)}
  .act svg{width:15px;height:15px}
  #loading,#err{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:40px}
  #err{display:none}
  #loading .spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--terra);border-radius:50%;animation:sp 0.9s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #loading p,#err p{color:var(--ink-soft);font-size:14px}
  #err h2{font-family:"Fraunces",Georgia,serif;font-weight:500;font-size:22px;color:var(--ink)}
  #err a{color:var(--terra)}
  #done{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(27,36,48,.92);color:var(--overlay-ink);text-align:center;padding:40px;border-radius:16px}
  #done .check{width:48px;height:48px;border-radius:50%;background:var(--teal);display:flex;align-items:center;justify-content:center}
  #done .check svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2.5}
  #done h3{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:21px}
  #done .sub{font-size:13px;color:rgba(245,247,250,.6)}
  #done .scenes{font-size:12px;color:rgba(245,247,250,.4)}
  #done .replay{margin-top:6px;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:10px 22px;border:0;border-radius:10px;background:var(--terra);color:#fff;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
  #done .replay svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2}
  @media (max-width:640px){
    .stage-wrap{padding:0}
    .deck-frame{width:100%;height:100%;aspect-ratio:auto;max-height:none;border:0;border-radius:0;box-shadow:none}
    .topbar .title{font-size:15px}
  }
</style>
</head>
<body>
<div class="topbar">
  <a class="back" href="index.html">&larr; Examples</a>
  <div class="meta">
    <div class="kicker" id="cat"></div>
    <div class="title" id="title">Loading…</div>
  </div>
</div>
<div class="stage-wrap">
  <div class="deck-frame">
    <iframe id="deck" title="Explain It deck" sandbox="allow-scripts"></iframe>
    <div id="loading"><div class="spin"></div><p>Loading example…</p></div>
    <div id="done">
      <div class="check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
      <h3>Explanation complete</h3>
      <div class="sub" id="done-topic"></div>
      <div class="scenes" id="done-scenes"></div>
      <button class="replay" id="done-replay"><svg viewBox="0 0 24 24"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>Replay</button>
    </div>
    <div id="err">
      <h2>Example not available</h2>
      <p id="err-msg"></p>
      <p><a href="index.html">&larr; Back to all examples</a></p>
    </div>
  </div>
</div>
<div class="actionbar">
  <button class="act" id="replay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>Replay</button>
</div>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var slug = (params.get('slug') || '').trim();
  var frame = document.getElementById('deck');
  var loading = document.getElementById('loading');
  var errBox = document.getElementById('err');
  var doneBox = document.getElementById('done');
  var titleEl = document.getElementById('title');
  var catEl = document.getElementById('cat');
  var audioEls = [];
  var current = 0;
  var topic = '';
  var totalScenes = 0;

  function slugOk(s){ return /^[a-z0-9-]+$/.test(s); }
  function fail(msg){ loading.style.display='none'; frame.style.display='none'; document.getElementById('err-msg').textContent = msg; errBox.style.display='flex'; }
  function cmd(action, payload){ try{ frame.contentWindow.postMessage({type:'deck:command',action:action,payload:payload},'*'); }catch(_){} }
  function stopAllAudio(){ audioEls.forEach(function(a){ if(a){ try{a.pause();a.currentTime=0;}catch(_){ } } }); }

  if (!slug){ fail('No example selected.'); return; }
  if (!slugOk(slug)){ fail('Invalid example id.'); return; }
  var base = 'decks/' + slug + '/';

  fetch(base + 'manifest.json').then(function(r){ if(!r.ok) throw new Error('manifest '+r.status); return r.json(); })
  .then(function(manifest){
    topic = manifest.title || slug;
    titleEl.textContent = topic;
    document.title = topic + ' — Explain It';
    catEl.textContent = manifest.category || '';
    totalScenes = manifest.sceneCount || (manifest.scenes||[]).length || 0;
    document.getElementById('done-topic').textContent = topic;
    document.getElementById('done-scenes').textContent = totalScenes ? (totalScenes + ' scenes completed') : '';
    (manifest.scenes || []).forEach(function(sc){
      if (sc && sc.audioPath){ var a = new Audio(base + sc.audioPath); a.preload='none'; audioEls[sc.index]=a; }
    });
    return fetch(base + 'deck-content.html');
  }).then(function(r){ if(!r.ok) throw new Error('deck-content '+r.status); return r.text(); })
  .then(function(html){
    if (/https?:\/\/[^"']*(api\.nebulacloud|\/api\/v1)|\/share\//.test(html)) throw new Error('deck references a production endpoint');
    frame.srcdoc = html;
  }).catch(function(e){ fail('Could not load this example (' + e.message + ').'); });

  function doReplay(){ doneBox.style.display='none'; stopAllAudio(); current=0; cmd('goTo',1); cmd('play'); var a=audioEls[0]; if(a){ try{a.currentTime=0;a.play().catch(function(){});}catch(_){ } } }
  document.getElementById('replay').addEventListener('click', doReplay);
  document.getElementById('done-replay').addEventListener('click', doReplay);

  window.addEventListener('message', function(ev){
    var d = ev.data; if (!d || typeof d !== 'object') return;
    if (d.type === 'deck:ready'){ loading.style.display='none'; }
    else if (d.type === 'deck:sceneChange'){
      doneBox.style.display='none';
      var idx = (d.scene || 1) - 1;
      if (audioEls[current]){ try{ audioEls[current].pause(); audioEls[current].currentTime=0; }catch(_){ } }
      current = idx;
      var a = audioEls[idx]; if (a){ try{ a.play().catch(function(){}); }catch(_){ } }
    } else if (d.type === 'deck:complete'){
      if (audioEls[current]){ try{ audioEls[current].pause(); }catch(_){ } }
      doneBox.style.display='flex';
    }
  });
})();
</script>
</body>
</html>
