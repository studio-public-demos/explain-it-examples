<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Explain It Example</title>
<meta name="description" content="A narrated visual explanation built with Explain It.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Spline+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0c1119;--panel:#141b26;--stage:#0f1620;--text:#eef2f7;--muted:#9aa8b8;
    --blue:#3d8bff;--blue-dim:rgba(61,139,255,.15);--border:#20293a;
    --sans:'Spline Sans',system-ui,sans-serif;--serif:'Fraunces',Georgia,serif;
  }
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);display:flex;flex-direction:column;overflow:hidden}
  a{color:inherit;text-decoration:none}

  header.bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0}
  header.bar .left{display:flex;align-items:center;gap:12px;min-width:0}
  header.bar .back{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}
  header.bar .back:hover{color:var(--text)}
  header.bar .title{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
  header.bar .right a.cta{background:var(--blue);color:#fff;padding:7px 14px;border-radius:100px;font-size:13px;font-weight:500}

  .stage-wrap{flex:1;min-height:0;position:relative;background:var(--stage)}
  #deckFrame{width:100%;height:100%;border:0;display:block;background:#fff}

  .controls{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-top:1px solid var(--border);flex-shrink:0}
  .controls button{background:transparent;border:1px solid var(--border);color:var(--text);width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
  .controls button:hover{border-color:var(--blue);color:var(--blue)}
  .controls button.play{background:var(--blue);border-color:var(--blue);color:#fff;width:44px;height:44px}
  .controls .scene-info{flex:1;font-size:13px;color:var(--muted);min-width:0}
  .controls .scene-info .st{color:var(--text);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .controls .quiz-btn{border-color:var(--blue);color:var(--blue);width:auto;padding:0 14px;gap:6px;font-size:13px;font-weight:500}

  .narration{padding:10px 16px;background:var(--panel);border-top:1px solid var(--border);font-size:14px;line-height:1.55;color:var(--muted);max-height:22vh;overflow-y:auto;flex-shrink:0}
  .narration:empty{display:none}

  /* Quiz overlay */
  .quiz{position:absolute;inset:0;background:rgba(12,17,25,.96);z-index:30;display:none;flex-direction:column;padding:24px;overflow-y:auto}
  .quiz.open{display:flex}
  .quiz .qwrap{max-width:640px;margin:auto;width:100%}
  .quiz h2{font-family:var(--serif);font-size:22px;margin-bottom:20px}
  .quiz .q{margin-bottom:22px}
  .quiz .q .qt{font-size:16px;font-weight:500;margin-bottom:12px}
  .quiz .opt{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:11px 14px;border-radius:10px;margin-bottom:8px;cursor:pointer;font-family:var(--sans);font-size:14px;transition:all .12s}
  .quiz .opt:hover{border-color:var(--blue)}
  .quiz .opt.correct{border-color:#2ec77a;background:rgba(46,199,122,.12)}
  .quiz .opt.wrong{border-color:#ff5c5c;background:rgba(255,92,92,.1)}
  .quiz .exp{font-size:13px;color:var(--muted);margin-top:8px;padding-left:4px;display:none}
  .quiz .exp.show{display:block}
  .quiz .close-quiz{position:absolute;top:16px;right:16px;background:var(--panel);border:1px solid var(--border);color:var(--text);width:36px;height:36px;border-radius:10px;cursor:pointer}

  .loading,.error{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--muted);text-align:center;padding:24px}
  .spinner{width:26px;height:26px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .hidden{display:none!important}
</style>
</head>
<body>
<div id="loading" class="loading"><div class="spinner"></div><div>Loading explanation…</div></div>

<div id="player" class="hidden" style="display:flex;flex-direction:column;flex:1;min-height:0">
  <header class="bar">
    <div class="left">
      <a class="back" href="index.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg> Examples</a>
      <span class="title" id="deckTitle"></span>
    </div>
    <div class="right"><a class="cta" href="https://app.nebulacloud.studio/auth/sign-up?redirect=%2Fapp" target="_blank" rel="noopener">Create yours →</a></div>
  </header>

  <div class="stage-wrap">
    <iframe id="deckFrame" title="Explanation deck" sandbox="allow-scripts allow-same-origin"></iframe>
    <div class="quiz" id="quiz">
      <button class="close-quiz" id="closeQuiz" aria-label="Close quiz">✕</button>
      <div class="qwrap" id="quizBody"></div>
    </div>
  </div>

  <div class="controls">
    <button id="prev" title="Previous scene" aria-label="Previous scene"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 20L9 12l10-8v16z"/><line x1="5" y1="19" x2="5" y2="5"/></svg></button>
    <button id="play" class="play" title="Play/Pause" aria-label="Play or pause"></button>
    <button id="next" title="Next scene" aria-label="Next scene"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4l10 8-10 8V4z"/><line x1="19" y1="5" x2="19" y2="19"/></svg></button>
    <button id="mute" title="Mute/Unmute" aria-label="Mute or unmute"></button>
    <div class="scene-info"><span class="st" id="sceneTitle"></span><span id="sceneCounter"></span></div>
    <button id="quizToggle" class="quiz-btn hidden">Quiz</button>
  </div>

  <div class="narration" id="narration"></div>
</div>

<div id="error" class="error hidden">
  <div style="font-size:30px">✦</div>
  <div id="errorMsg">This example could not be found.</div>
  <a href="index.html" style="color:var(--blue)">← Back to examples</a>
</div>

<script>
const ICON_PLAY = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>';
const ICON_PAUSE = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';
const ICON_MUTE = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>';
const ICON_UNMUTE = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>';

const params = new URLSearchParams(location.search);
const slug = params.get('slug');

let manifest = null;
let scenes = [];
let idx = 0;
let playing = false;
let muted = false;
let audio = new Audio();
let sceneTimer = null;

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function boot(){
  if(!slug){ return showError('No example specified.'); }
  let base = 'decks/' + slug + '/';
  try{
    const r = await fetch(base + 'manifest.json', {cache:'no-cache'});
    if(!r.ok) throw new Error('manifest '+r.status);
    manifest = await r.json();
  }catch(e){ return showError('This example could not be found.'); }

  scenes = Array.isArray(manifest.scenes) ? manifest.scenes : [];
  document.title = (manifest.title || 'Explain It Example') + ' — Explain It Examples';
  $('deckTitle').textContent = manifest.title || '';

  // Load the self-contained deck HTML into the iframe (same-origin static file).
  const deckPath = base + (manifest.deckHtmlPath || 'deck-content.html');
  try{
    const dr = await fetch(deckPath, {cache:'no-cache'});
    if(!dr.ok) throw new Error('deck '+dr.status);
    const html = await dr.text();
    $('deckFrame').srcdoc = html;
  }catch(e){ return showError('The deck content is unavailable.'); }

  // Quiz availability
  if(Array.isArray(manifest.quiz) && manifest.quiz.length){
    $('quizToggle').classList.remove('hidden');
    renderQuiz(base);
  }

  $('loading').classList.add('hidden');
  $('player').classList.remove('hidden');
  wireControls(base);
  goto(0, false);
}

function showError(msg){
  $('loading').classList.add('hidden');
  $('player').classList.add('hidden');
  $('errorMsg').textContent = msg;
  $('error').classList.remove('hidden');
}

function currentAudioSrc(base, sc){
  if(!sc || !sc.audioPath) return null;
  return base + sc.audioPath;
}

function goto(i, autoplay){
  if(i < 0 || i >= scenes.length) { if(i>=scenes.length){ stop(); } return; }
  idx = i;
  const sc = scenes[idx];
  $('sceneTitle').textContent = sc.title || ('Scene ' + (idx+1));
  $('sceneCounter').textContent = 'Scene ' + (idx+1) + ' of ' + scenes.length;
  $('narration').textContent = sc.narration || '';
  // Canonical deck protocol: hold the deck's own timer and drive scene changes explicitly.
  try{
    $('deckFrame').contentWindow.postMessage({type:'deck:command', action:'holdTimer'}, '*');
    $('deckFrame').contentWindow.postMessage({type:'deck:command', action:'goTo', payload: idx+1}, '*');
  }catch(e){}
  playSceneAudio(sc, autoplay);
  scheduleAdvance(sc);
}

function playSceneAudio(sc, autoplay){
  stopAudio();
  const src = currentAudioSrc(base(), sc);
  if(src && !muted){
    audio.src = src;
    audio.currentTime = 0;
    if(autoplay || playing){ audio.play().catch(()=>{}); }
  }
}

function base(){ return 'decks/' + slug + '/'; }

function scheduleAdvance(sc){
  clearTimeout(sceneTimer);
  if(!playing) return;
  // Prefer audio duration; else manifest durationSec; else default 8s.
  const useAudio = audio.src && !muted;
  if(useAudio){
    audio.onended = () => { if(playing) goto(idx+1, true); };
  } else {
    const ms = (sc.durationSec ? sc.durationSec : 8) * 1000;
    sceneTimer = setTimeout(() => { if(playing) goto(idx+1, true); }, ms);
  }
}

function postDeck(action, payload){ try{ $('deckFrame').contentWindow.postMessage({type:'deck:command', action, payload}, '*'); }catch(e){} }
function play(){ playing = true; $('play').innerHTML = ICON_PAUSE; postDeck('holdTimer'); if(audio.src && !muted) audio.play().catch(()=>{}); scheduleAdvance(scenes[idx]); }
function pause(){ playing = false; $('play').innerHTML = ICON_PLAY; audio.pause(); clearTimeout(sceneTimer); }
function stop(){ pause(); }
function stopAudio(){ try{ audio.pause(); audio.onended=null; }catch(e){} }

function wireControls(){
  $('play').innerHTML = ICON_PLAY;
  $('mute').innerHTML = ICON_UNMUTE;
  $('play').onclick = () => playing ? pause() : play();
  $('prev').onclick = () => { goto(Math.max(0, idx-1), playing); };
  $('next').onclick = () => { goto(Math.min(scenes.length-1, idx+1), playing); };
  $('mute').onclick = () => {
    muted = !muted;
    $('mute').innerHTML = muted ? ICON_MUTE : ICON_UNMUTE;
    if(muted){ audio.pause(); } else if(playing && audio.src){ audio.play().catch(()=>{}); }
  };
  $('quizToggle').onclick = () => { pause(); $('quiz').classList.add('open'); };
  $('closeQuiz').onclick = () => { $('quiz').classList.remove('open'); };
}

function renderQuiz(base){
  const body = $('quizBody');
  let html = '<h2>Quick quiz</h2>';
  manifest.quiz.forEach((q, qi) => {
    html += '<div class="q" data-qi="'+qi+'"><div class="qt">'+(qi+1)+'. '+esc(q.question)+'</div>';
    (q.options||[]).forEach((opt, oi) => {
      html += '<button class="opt" data-qi="'+qi+'" data-oi="'+oi+'">'+esc(opt)+'</button>';
    });
    html += '<div class="exp" data-qi="'+qi+'">'+esc(q.explanation||'')+'</div></div>';
  });
  body.innerHTML = html;
  body.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => {
      const qi = +btn.dataset.qi, oi = +btn.dataset.oi;
      const q = manifest.quiz[qi];
      const container = body.querySelector('.q[data-qi="'+qi+'"]');
      container.querySelectorAll('.opt').forEach(b => { b.disabled = true; });
      if(oi === q.answerIndex){ btn.classList.add('correct'); }
      else { btn.classList.add('wrong'); const correct = container.querySelector('.opt[data-oi="'+q.answerIndex+'"]'); if(correct) correct.classList.add('correct'); }
      const exp = container.querySelector('.exp'); if(exp) exp.classList.add('show');
    };
  });
}

boot();
</script>
</body>
</html>
