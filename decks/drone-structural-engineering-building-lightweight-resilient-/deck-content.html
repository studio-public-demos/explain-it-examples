<div id="scene-container" role="group" aria-label="Scenes"><div class="scene-wrap active" data-narration="Drone structural engineering is a critical field balancing strength, minimal weight, and optimal aerodynamics. This complex interplay allows drones to perform diverse tasks, often carrying payloads up to 50% of their own weight." data-duration="10000" role="tabpanel" aria-label="Scene 1"><h1>The Art of Drone Structures</h1><div class="art" role="img" aria-label="Visual diagram for scene 1"><svg viewBox='0 0 700 380' xmlns='http://www.w3.org/2000/svg'><g class='scale-up' style='animation-delay:0.1s'><text x='350' y='175' font-size='52' text-anchor='middle'>✈️</text><text x='350' y='215' font-size='14' fill='var(--ink)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Drone Design</text></g><g class='draw' style='animation-delay:0.4s'><line x1="310" y1="140" x2="200" y2="90" stroke='#cbbfa9' stroke-width='1.5'/><line x1="390" y1="140" x2="500" y2="90" stroke='#cbbfa9' stroke-width='1.5'/><line x1="310" y1="200" x2="180" y2="270" stroke='#cbbfa9' stroke-width='1.5'/></g><g class='pulse-in' style='animation-delay:0.6s'><text x='180' y='80' font-size='36' text-anchor='middle'>💪</text><text x='180' y='105' font-size='11' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Strength</text></g><g class='pulse-in' style='animation-delay:0.7s'><text x='520' y='80' font-size='36' text-anchor='middle'>⚖️</text><text x='520' y='105' font-size='11' fill='var(--ink-soft)' text-anchor='middle' font-anchor='middle' font-family='Spline Sans,sans-serif'>Weight</text></g><g class='pulse-in' style='animation-delay:0.8s'><text x='160' y='275' font-size='36' text-anchor='middle'>💨</text><text x='160' y='300' font-size='11' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Aerodynamics</text></g></svg></div></div>
<div class="scene-wrap" data-narration="Drone structures must withstand constant forces: lift from rotors, opposing gravity, thrust for forward motion, and resisting drag. Engineers meticulously design frames to manage these dynamic loads." data-duration="12000" role="tabpanel" aria-label="Scene 2"><h2>Balancing Flight Forces</h2><div class="art" role="img" aria-label="Visual diagram for scene 2"><svg viewBox='0 0 700 380' xmlns='http://www.w3.org/2000/svg'><g class='pulse-in' style='animation-delay:0.1s'><text x='350' y='160' font-size='48' text-anchor='middle'>✈️</text><text x='350' y='200' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Drone</text></g><g class='draw' style='animation-delay:0.3s'><line x1="350" y1="100" x2="350" y2="130" stroke='var(--terra)' stroke-width='2'/><polygon points='350,95 345,105 355,105' fill='var(--terra)'/><line x1="350" y1="210" x2="350" y2="240" stroke='var(--teal)' stroke-width='2'/><polygon points='350,245 345,235 355,235' fill='var(--teal)'/><line x1="280" y1="160" x2="320" y2="160" stroke='var(--terra)' stroke-width='2'/><polygon points='275,160 285,155 285,165' fill='var(--terra)'/><line x1="380" y1="160" x2="420" y2="160" stroke='var(--teal)' stroke-width='2'/><polygon points='425,160 415,155 415,165' fill='var(--teal)'/></g><g class='fade-up' style='animation-delay:0.5s'><text x='350' y='70' font-size='36' text-anchor='middle'>⬆️</text><text x='350' y='95' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Lift</text></g><g class='fade-up' style='animation-delay:0.6s'><text x='350' y='270' font-size='36' text-anchor='middle'>⬇️</text><text x='350' y='295' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Gravity</text></g><g class='fade-up' style='animation-delay:0.7s'><text x='230' y='160' font-size='36' text-anchor='middle'>⬅️</text><text x='230' y='185' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Drag</text></g><g class='fade-up' style='animation-delay:0.8s'><text x='470' y='160' font-size='36' text-anchor='middle'>➡️</text><text x='470' y='185' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Thrust</text></g></svg></div></div>
<div class="scene-wrap" data-narration="A drone's structural integrity relies on its frame, which houses vital components like motors, batteries, and the flight controller. Materials like carbon fiber provide high strength-to-weight ratios, crucial for maximizing flight time." data-duration="10000" role="tabpanel" aria-label="Scene 3"><h2>Anatomy of a Drone Frame</h2><div class="art" role="img" aria-label="Visual diagram for scene 3"><svg viewBox='0 0 700 380' xmlns='http://www.w3.org/2000/svg'><g class='scale-up' style='animation-delay:0.1s'><rect x='150' y='70' rx='12' width='400' height='240' fill='rgba(47,125,119,0.08)' stroke='var(--teal)' stroke-width='2'/><text x='350' y='100' font-size='16' fill='var(--ink)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Drone Frame</text></g><g class='pulse-in' style='animation-delay:0.4s'><text x='250' y='170' font-size='40' text-anchor='middle'>⚙️</text><text x='250' y='200' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Motors</text></g><g class='pulse-in' style='animation-delay:0.5s'><text x='450' y='170' font-size='40' text-anchor='middle'>🔋</text><text x='450' y='200' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Battery</text></g><g class='pulse-in' style='animation-delay:0.6s'><text x='350' y='250' font-size='40' text-anchor='middle'>🧠</text><text x='350' y='280' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Controller</text></g></svg></div></div>
<div class="scene-wrap" data-narration="Modern drones use carbon fiber composites for strength and lightness. Engineers employ Finite Element Analysis (FEA) to simulate stress, optimizing designs before physical prototyping and reducing development costs by up to 30%." data-duration="12000" role="tabpanel" aria-label="Scene 4"><h2>Carbon Fiber &amp; Stress Analysis</h2><div class="art" role="img" aria-label="Visual diagram for scene 4"><svg viewBox='0 0 700 380' xmlns='http://www.w3.org/2000/svg'><g class='pulse-in' style='animation-delay:0.1s'><text x='120' y='160' font-size='48' text-anchor='middle'>💎</text><text x='120' y='200' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Carbon Fiber</text></g><g class='draw' style='animation-delay:0.3s'><line x1="170" y1="155" x2="280" y2="155" stroke='#cbbfa9' stroke-width='2' stroke-dasharray='6,4'/><polygon points='280,150 295,155 280,160' fill='var(--teal)'/></g><g class='fade-up' style='animation-delay:0.5s'><text x='350' y='160' font-size='44' text-anchor='middle'>🧮</text><text x='350' y='200' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>FEA Simulation</text></g><g class='draw' style='animation-delay:0.7s'><line x1="405" y1="155" x2="510" y2="155" stroke='#cbbfa9' stroke-width='2' stroke-dasharray='6,4'/><polygon points='510,150 525,155 510,160' fill='var(--teal)'/></g><g class='pulse-in' style='animation-delay:0.9s'><text x='580' y='160' font-size='48' text-anchor='middle'>💪</text><text x='580' y='200' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Optimized Structure</text></g></svg></div></div>
<div class="scene-wrap" data-narration="Advanced structural engineering enables drones for diverse future applications, from rapid package delivery and critical medical transport to infrastructure inspection and environmental monitoring." data-duration="10000" role="tabpanel" aria-label="Scene 5"><h2>Future of Drone Design</h2><div class="art" role="img" aria-label="Visual diagram for scene 5"><svg viewBox='0 0 700 380' xmlns='http://www.w3.org/2000/svg'><g class='pulse-in' style='animation-delay:0.1s'><text x='350' y='80' font-size='48' text-anchor='middle'>✈️</text><text x='350' y='120' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Advanced Drones</text></g><g class='draw' style='animation-delay:0.3s'><line x1="350" y1="135" x2="200" y2="190" stroke='#cbbfa9' stroke-width='1.5'/><line x1="350" y1="135" x2="300" y2="270" stroke='#cbbfa9' stroke-width='1.5'/><line x1="350" y1="135" x2="400" y2="270" stroke='#cbbfa9' stroke-width='1.5'/><line x1="350" y1="135" x2="500" y2="190" stroke='#cbbfa9' stroke-width='1.5'/></g><g class='fade-up' style='animation-delay:0.5s'><text x='180' y='190' font-size='36' text-anchor='middle'>📦</text><text x='180' y='215' font-size='11' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Delivery</text></g><g class='fade-up' style='animation-delay:0.6s'><text x='520' y='190' font-size='36' text-anchor='middle'>🏥</text><text x='520' y='215' font-size='11' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Medical</text></g><g class='fade-up' style='animation-delay:0.7s'><text x='280' y='270' font-size='36' text-anchor='middle'>🏗️</text><text x='280' y='295' font-size='11' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Inspection</text></g><g class='fade-up' style='animation-delay:0.8s'><text x='420' y='270' font-size='36' text-anchor='middle'>🌍</text><text x='420' y='295' font-size='11' fill='var(- function hl(n){var sc=s[c];if(!sc)return;var gs=sc.querySelectorAll('.art svg g[data-step]');for(var i=0;i<gs.length;i++){if(i<n){gs[i].classList.remove('svg-dimmed')}else{gs[i].classList.add('svg-dimmed')}}}

/* Interactive SVG — tap/click to focus elements, hover to highlight */
var tooltip=document.createElement('div');tooltip.className='svg-tooltip';document.body.appendChild(tooltip);var focusedEl=null;
function clearFocus(){if(focusedEl){focusedEl.classList.remove('svg-focus');focusedEl=null}tooltip.classList.remove('visible');clrHl()}
