<div class="stage" id="stage" role="region" aria-label="Photogrammetry: From Photos to 3D Models - Visual Explanation" aria-roledescription="slide deck">
<div class="progress" id="progress" role="tablist" aria-label="Scene navigation"></div>
<div class="kicker">Photogrammetry: From Photos to 3D Models</div>
<div id="scene-container" role="group" aria-label="Scenes"><div class="scene-wrap active" data-narration="Photogrammetry transforms multiple 2D photos into precise 3D models, capturing real-world objects and environments with incredible detail. This technique is surprisingly accurate, often achieving sub-millimeter precision." data-duration="10000" role="tabpanel" aria-label="Scene 1"><h1>From Photos to 3D Models</h1><div class="art" role="img" aria-label="Visual diagram for scene 1"><svg viewBox='0 0 700 380'><g class='scale-up' style='animation-delay:0.1s'><text x='350' y='175' font-size='52' text-anchor='middle'>📦</text><text x='350' y='215' font-size='14' fill='var(--ink)' text-anchor='middle' font-family='Spline Sans,sans-serif'>3D Model</text></g><g class='draw' style='animation-delay:0.4s'><line x1="310" y1="140" x2="200" y2="90" stroke='#cbbfa9' stroke-width='1.5'/><line x1="390" y1="140" x2="500" y2="90" stroke='#cbbfa9' stroke-width='1.5'/><line x1="310" y1="200" x2="180" y2="270" stroke='#cbbfa9' stroke-width='1.5'/><line x1="390" y1="200" x2="520" y2="270" stroke='#cbbfa9' stroke-width='1.5'/></g><g class='pulse-in' style='animation-delay:0.6s'><text x='180' y='80' font-size='36' text-anchor='middle'>📷</text><text x='180' y='105' font-size='11' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Photos</text></g><g class='pulse-in' style='animation-delay:0.7s'><text x='520' y='80' font-size='36' text-anchor='middle'>🏛️</text><text x='520' y='105' font-size='11' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Heritage</text></g><g class='pulse-in' style='animation-delay:0.8s'><text x='160' y='275' font-size='36' text-anchor='middle'>🎮</text><text x='160' y='300' font-size='11' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Gaming/VR</text></g><g class='pulse-in' style='animation-delay:0.9s'><text x='540' y='275' font-size='36' text-anchor='middle'>🔬</text><text x='540' y='300' font-size='11' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Inspection</text></g></svg></div></div>
<div class="scene-wrap" data-narration="The core principle relies on identifying the same feature points in multiple overlapping images, taken from different camera positions. By triangulating these points, the system precisely calculates their 3D coordinates, much like a GPS satellite locating your phone." data-duration="12000" role="tabpanel" aria-label="Scene 2"><h2>Triangulating 3D Points</h2><div class="art" role="img" aria-label="Visual diagram for scene 2"><svg viewBox='0 0 700 380'><g class='pulse-in' style='animation-delay:0.1s'><text x='150' y='100' font-size='48' text-anchor='middle'>📷</text><text x='150' y='140' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>View 1</text></g><g class='pulse-in' style='animation-delay:0.3s'><text x='350' y='70' font-size='48' text-anchor='middle'>📷</text><text x='350' y='110' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>View 2</text></g><g class='pulse-in' style='animation-delay:0.5s'><text x='550' y='100' font-size='48' text-anchor='middle'>📷</text><text x='550' y='140' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>View 3</text></g><g class='draw' style='animation-delay:0.7s'><line x1="150" y1="100" x2="350" y2="250" stroke='var(--teal)' stroke-width='2'/><line x1="350" y1="70" x2="350" y2="250" stroke='var(--teal)' stroke-width='2'/><line x1="550" y1="100" x2="350" y2="250" stroke='var(--teal)' stroke-width='2'/></g><g class='pulse-in' style='animation-delay:0.9s'><text x='350' y='250' font-size='48' text-anchor='middle'>📍</text><text x='350' y='290' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>3D Point</text></g></svg></div></div>
<div class="scene-wrap" data-narration="The process begins with image acquisition, followed by detecting unique features and estimating each camera's position. These steps lead to a dense point cloud, which is then converted into a textured 3D mesh model." data-duration="12000" role="tabpanel" aria-label="Scene 3"><h2>The Reconstruction Pipeline</h2><div class="art" role="img" aria-label="Visual diagram for scene 3"><svg viewBox='0 0 700 380'><g class='pulse-in' style='animation-delay:0.1s'><text x='100' y='160' font-size='44' text-anchor='middle'>📸</text><text x='100' y='200' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>1. Capture</text></g><g class='draw' style='animation-delay:0.3s'><line x1="130" y1="155" x2="190" y2="155" stroke='#cbbfa9' stroke-width='2'/><polygon points='190,150 205,155 190,160' fill='var(--teal)'/></g><g class='fade-up' style='animation-delay:0.4s'><text x='230' y='160' font-size='44' text-anchor='middle'>🔍</text><text x='230' y='200' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>2. Features</text></g><g class='draw' style='animation-delay:0.6s'><line x1="260" y1="155" x2="320" y2="155" stroke='#cbbfa9' stroke-width='2'/><polygon points='320,150 335,155 320,160' fill='var(--teal)'/></g><g class='fade-up' style='animation-delay:0.7s'><text x='360' y='160' font-size='44' text-anchor='middle'>🛰️</text><text x='360' y='200' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>3. Camera Pose</text></g><g class='draw' style='animation-delay:0.9s'><line x1="390" y1="155" x2="450" y2="155" stroke='#cbbfa9' stroke-width='2'/><polygon points='450,150 465,155 450,160' fill='var(--teal)'/></g><g class='fade-up' style='animation-delay:1.0s'><text x='490' y='160' font-size='44' text-anchor='middle'>☁️</text><text x='490' y='200' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>4. Point Cloud</text></g><g class='draw' style='animation-delay:1.2s'><line x1="520" y1="155" x2="580" y2="155" stroke='#cbbfa9' stroke-width='2'/><polygon points='580,150 595,155 580,160' fill='var(--teal)'/></g><g class='fade-up' style='animation-delay:1.3s'><text x='620' y='160' font-size='44' text-anchor='middle'>📦</text><text x='620' y='200' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>5. 3D Mesh</text></g></svg></div></div>
<div class="scene-wrap" data-narration="Photogrammetry is vital for creating digital twins of historical sites and artifacts, ensuring their preservation for future generations. For example, the entire Pompeii archaeological park has been digitally reconstructed, offering virtual exploration." data-duration="12000" role="tabpanel" aria-label="Scene 4"><h2>Digital Twins &amp; Cultural Heritage</h2><div class="art" role="img" aria-label="Visual diagram for scene 4"><svg viewBox='0 0 700 380'><g class='scale-up' style='animation-delay:0.1s'><rect x='100' y='50' width='500' height='250' rx='12' fill='rgba(47,125,119,0.08)' stroke='var(--teal)' stroke-width='1.5'/></g><g class='pulse-in' style='animation-delay:0.3s'><text x='350' y='100' font-size='48' text-anchor='middle'>🏛️</text><text x='350' y='140' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Ancient Site</text></g><g class='pulse-in' style='animation-delay:0.5s'><text x='220' y='220' font-size='40' text-anchor='middle'>🗿</text><text x='220' y='255' font-size='12' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Artifact</text></g><g class='pulse-in' style='animation-delay:0.7s'><text x='480' y='220' font-size='40' text-anchor='middle'>📦</text><text x='480' y='255' font-size='12' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Digital Twin</text></g><g class='fade-up' style='animation-delay:0.9s'><text x='350' y='320' font-size='14' fill='var(--ink)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Preserving History Digitally</text><text x='350' y='340' font-size='36' text-anchor='middle'>💾</text></g></svg></div></div>
<div class="scene-wrap" data-narration="Photogrammetry bridges the gap between the physical and digital worlds, powering applications from immersive VR/AR experiences to precise industrial inspections. It's a cornerstone for creating realistic virtual environments and enhancing autonomous systems." data-duration="10000" role="tabpanel" aria-label="Scene 5"><h2>Enabling New Realities</h2><div class="art" role="img" aria-label="Visual diagram for scene 5"><svg viewBox='0 0 700 380'><g class='pulse-in' style='animation-delay:0.1s'><text x='150' y='160' font-size='48' text-anchor='middle'>🌍</text><text x='150' y='200' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Physical World</text></g><g class='draw' style='animation-delay:0.3s'><line x1="200" y1="155" x2="300" y2="155" stroke='#cbbfa9' stroke-width='2'/><polygon points='300,150 315,155 300,160' fill='var(--teal)'/></g><g class='fade-up' style='animation-delay:0.5s'><text x='350' y='160' font-size='44' text-anchor='middle'>🧠</text><text x='350' y='200' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Processing</text></g><g class='draw' style='animation-delay:0.7s'><line x1="400" y1="155" x2="500" y2="155" stroke='#cbbfa9' stroke-width='2'/><polygon points='500,150 515,155 500,160' fill='var(--teal)'/></g><g class='pulse-in' style='animation-delay:0.9s'><text x='550' y='160' font-size='48' text-anchor='middle'>🌐</text><text x='550' y='200' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Digital World</text></g><g class='pulse-in' style='animation-delay:1.1s'><text x='350' y='280' font-size='40' text-anchor='middle'>🚀</text><text x='350' y='315' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Future Potential</text></g></svg></div></div></div>

<script>(function(){
var s=document.querySelectorAll('.scene-wrap'),t=s.length,c=0,p=0,T=null,sp=1,held=0;
var ne=document.getElementById('narration'),ce=document.getElementById('counter'),pe=document.getElementById('progress');
if(!s||!t){window.parent.postMessage({type:'deck:ready'},'*');return}
for(var i=0;i<t;i++){var e=document.createElement('div');e.className='seg';e.innerHTML='<i></i>';var dur=parseInt(s[i].dataset.duration)||8000;e.style.setProperty('--dur',dur+'ms');e.onclick=(function(idx){return function(){g(idx)}})(i);pe.appendChild(e)}
function g(i){if(i<0||i>=t)return;s[c].classList.remove('active');c=i;s[c].classList.add('active');if(ne)ne.innerHTML=s[c].dataset.narration||'';if(ce)ce.textContent=String(c+1).padStart(2,'0')+' / '+String(t).padStart(2,'0');u();window.parent.postMessage({type:'deck:sceneChange',scene:c+1,total:t},'*');if(p&&!held)r();clearFocus()}
function u(){var x=pe.children;for(var i=0;i<x.length;i++){x[i].className=i<c?'seg done':i===c?'seg active':'seg'}}
function r(){clearTimeout(T);if(held)return;var a=parseInt(s[c].dataset.duration)||8000;T=setTimeout(function(){if(c<t-1)g(c+1);else{p=0;window.parent.postMessage({type:'deck:complete'},'*')}},a/sp)}
function play(){p=1;if(!held)r()}
function pause(){p=0;clearTimeout(T)}
document.getElementById('prev').onclick=function(){g(c-1)};
document.getElementById('next').onclick=function(){g(c+1)};
document.getElementById('play').onclick=function(){p?pause():play()};
document.addEventListener('keydown',function(ev){if(ev.key==='ArrowRight')g(c+1);else if(ev.key==='ArrowLeft')g(c-1);else if(ev.key===' '){ev.preventDefault();p?pause():play()}});
function hl(n){var sc=s[c];if(!sc)return;var gs=sc.querySelectorAll('.art svg g[data-step]');for(var i=0;i<gs.length;i++){if(i<n){gs[i].classList.remove('svg-dimmed')}else{gs[i].classList.add('svg-dimmed')}}}
function clrHl(){var sc=s[c];if(!sc)return;var gs=sc.querySelectorAll('.art svg g[data-step]');for(var i=0;i<gs.length;i++){gs[i].classList.remove('svg-dimmed')}}
/* Interactive SVG — tap/click to focus elements, hover to highlight */
var tooltip=document.createElement('div');tooltip.className='svg-tooltip';document.body.appendChild(tooltip);var focusedEl=null;
function clearFocus(){if(focusedEl){focusedEl.classList.remove('svg-focus');focusedEl=null}tooltip.classList.remove('visible');clrHl()}
function getLabel(el){var txt=el.querySelector('text');if(txt)return txt.textContent||'';var title=el.querySelector('title');if(title)return title.textContent||'';return''}
function showTooltip(el,label){if(!label)return;var r=el.getBoundingClientRect();var sr=document.querySelector('.stage').getBoundingClientRect();tooltip.textContent=label;tooltip.classList.add('visible');var tx=r.left+r.width/2-sr.left-tooltip.offsetWidth/2;var ty=r.top-sr.top-tooltip.offsetHeight-8;if(ty<0)ty=r.bottom-sr.top+8;tooltip.style.left=Math.max(4,Math.min(tx,sr.width-tooltip.offsetWidth-4))+'px';tooltip.style.top=ty+'px'}
document.addEventListener('click',function(ev){var tgt=ev.target;while(tgt&&tgt!==document.body){if(tgt.hasAttribute&&tgt.hasAttribute('data-step')){ev.stopPropagation();if(focusedEl===tgt){clearFocus();return}clearFocus();focusedEl=tgt;tgt.classList.add('svg-focus');var lbl=getLabel(tgt);if(lbl)showTooltip(tgt,lbl);var step=parseInt(tgt.getAttribute('data-step'))||0;window.parent.postMessage({type:'deck:interaction',action:'focus',step:step,label:lbl},'*');return}tgt=tgt.parentElement}clearFocus()});
window.addEventListener('message',function(ev){if(!ev.data||ev.data.type!=='deck:command')return;var a=ev.data.action;if(a==='next')g(c+1);else if(a==='prev')g(c-1);else if(a==='play')play();else if(a==='pause')pause();else if(a==='goTo'){var idx=(ev.data.payload||1)-1;g(idx)}else if(a==='setSpeed'){sp=ev.data.payload||1}else if(a==='holdTimer'){held=1;clearTimeout(T)}else if(a==='releaseTimer'){held=0;if(p)r()}else if(a==='highlight'){hl(ev.data.payload||0)}else if(a==='clearHighlight'){clrHl()}else if(a==='focusStep'){var sc=s[c];if(sc){var gs=sc.querySelectorAll('.art svg g[data-step]');var idx2=(ev.data.payload||1)-1;if(gs[idx2]){clearFocus();focusedEl=gs[idx2];gs[idx2].classList.add('svg-focus');var l2=getLabel(gs[idx2]);if(l2)showTooltip(gs[idx2],l2)}}}});
g(0);window.parent.postMessage({type:'deck:ready'},'*');
})()</script></body></html>
