<div id="scene-container" role="group" aria-label="Scenes"><div class="scene-wrap active" data-narration="Remote sensing captures data about Earth's surface without physical contact, often from satellites or aircraft. These 'eyes in the sky' collect electromagnetic radiation, revealing details invisible to the naked eye, like vegetation health or temperature shifts." data-duration="12000" role="tabpanel" aria-label="Scene 1"><h1>Eyes in the Sky: Remote Sensing Basics</h1><div class="art" role="img" aria-label="Visual diagram for scene 1"><svg viewBox='0 0 700 380'><g class='pulse-in' style='animation-delay:0.1s'><text x='120' y='160' font-size='48' text-anchor='middle'>🛰️</text><text x='120' y='200' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Satellite</text></g><g class='draw' style='animation-delay:0.3s'><path d='M160,150 Q250,100 350,150' stroke='#cbbfa9' stroke-width='2' fill='none'/><polygon points='350,145 365,150 350,155' fill='var(--teal)'/></g><g class='pulse-in' style='animation-delay:0.5s'><text x='350' y='160' font-size='48' text-anchor='middle'>📡</text><text x='350' y='200' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Sensor</text></g><g class='draw' style='animation-delay:0.7s'><path d='M390,150 Q450,200 550,150' stroke='#cbbfa9' stroke-width='2' fill='none'/><polygon points='550,145 565,150 550,155' fill='var(--teal)'/></g><g class='pulse-in' style='animation-delay:0.9s'><text x='580' y='160' font-size='48' text-anchor='middle'>🌍</text><text x='580' y='200' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Earth Surface</text></g></svg></div></div>
<div class="scene-wrap" data-narration="Geographic Information Systems (GIS) integrate, analyze, and visualize spatial data, turning raw information into interactive maps. It's like a digital atlas that understands where things are and how they relate, revealing patterns and trends." data-duration="12000" role="tabpanel" aria-label="Scene 2"><h2>GIS: Mapping Data to Location</h2><div class="art" role="img" aria-label="Visual diagram for scene 2"><svg viewBox='0 0 700 380'><g class='pulse-in' style='animation-delay:0.1s'><text x='150' y='100' font-size='40' text-anchor='middle'>📊</text><text x='150' y='130' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Data</text></g><g class='pulse-in' style='animation-delay:0.3s'><text x='150' y='200' font-size='40' text-anchor='middle'>📍</text><text x='150' y='230' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Location</text></g><g class='pulse-in' style='animation-delay:0.5s'><text x='150' y='300' font-size='40' text-anchor='middle'>📸</text><text x='150' y='330' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Imagery</text></g><g class='draw' style='animation-delay:0.7s'><line x1='220' y1='100' x2='300' y2='175' stroke='#cbbfa9' stroke-width='2'/><line x1='220' y1='200' x2='300' y2='175' stroke='#cbbfa9' stroke-width='2'/><line x1='220' y1='300' x2='300' y2='175' stroke='#cbbfa9' stroke-width='2'/><polygon points='300,170 315,175 300,180' fill='var(--terra)'/></g><g class='scale-up' style='animation-delay:0.9s'><rect x='320' y='140' width='100' height='70' rx='8' fill='rgba(47,125,119,0.08)'/><text x='370' y='175' font-size='36' text-anchor='middle'>🧮</text><text x='370' y='200' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Analysis</text></g><g class='draw' style='animation-delay:1.1s'><line x1='430' y1='175' x2='500' y2='175' stroke='#cbbfa9' stroke-width='2'/><polygon points='500,170 515,175 500,180' fill='var(--terra)'/></g><g class='pulse-in' style='animation-delay:1.3s'><text x='580' y='175' font-size='48' text-anchor='middle'>🗺️</text><text x='580' y='215' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Interactive Map</text></g></svg></div></div>
<div class="scene-wrap" data-narration="Remote sensing captures raw data (pixels), which GIS then processes into meaningful layers. For instance, satellite images of a forest become layers showing tree density, species, or deforestation rates, enabling detailed environmental monitoring." data-duration="10000" role="tabpanel" aria-label="Scene 3"><h2>From Pixels to Insights: Data Flow</h2><div class="art" role="img" aria-label="Visual diagram for scene 3"><svg viewBox='0 0 700 380'><g class='pulse-in' style='animation-delay:0.1s'><text x='100' y='100' font-size='40' text-anchor='middle'>🛰️</text><text x='100' y='130' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Sensor Data</text></g><g class='draw' style='animation-delay:0.3s'><line x1='150' y1='100' x2='250' y2='100' stroke='#cbbfa9' stroke-width='2'/><polygon points='250,95 265,100 250,105' fill='var(--teal)'/></g><g class='pulse-in' style='animation-delay:0.5s'><text x='300' y='100' font-size='40' text-anchor='middle'>☁️</text><text x='300' y='130' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Cloud Storage</text></g><g class='draw' style='animation-delay:0.7s'><line x1='350' y1='100' x2='450' y2='100' stroke='#cbbfa9' stroke-width='2'/><polygon points='450,95 465,100 450,105' fill='var(--teal)'/></g><g class='pulse-in' style='animation-delay:0.9s'><text x='500' y='100' font-size='40' text-anchor='middle'>💻</text><text x='500' y='130' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>GIS Processing</text></g><g class='draw' style='animation-delay:1.1s'><line x1='500' y1='150' x2='500' y2='250' stroke='#cbbfa9' stroke-width='2'/><polygon points='495,250 500,265 505,250' fill='var(--teal)'/></g><g class='pulse-in' style='animation-delay:1.3s'><text x='500' y='300' font-size='40' text-anchor='middle'>🗺️</text><text x='500' y='330' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Thematic Map</text></g><g class='draw' style='animation-delay:1.5s'><line x1='450' y1='300' x2='350' y2='300' stroke='#cbbfa9' stroke-width='2'/><polygon points='350,295 335,300 350,305' fill='var(--teal)'/></g><g class='pulse-in' style='animation-delay:1.7s'><text x='300' y='300' font-size='40' text-anchor='middle'>💡</text><text x='300' y='330' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Insights</text></g><g class='draw' style='animation-delay:1.9s'><line x1='250' y1='300' x2='150' y2='300' stroke='#cbbfa9' stroke-width='2'/><polygon points='150,295 135,300 150,305' fill='var(--teal)'/></g><g class='pulse-in' style='animation-delay:2.1s'><text x='100' y='300' font-size='40' text-anchor='middle'>✅</text><text x='100' y='330' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Decision</text></g></svg></div></div>
<div class="scene-wrap" data-narration="Remote sensing and GIS are crucial for urban planning. Satellite imagery identifies land use changes, while GIS layers population density, infrastructure, and environmental data. This helps planners optimize city growth, manage resources, and predict future needs." data-duration="12000" role="tabpanel" aria-label="Scene 4"><h2>Urban Planning with Geospatial Tech</h2><div class="art" role="img" aria-label="Visual diagram for scene 4"><svg viewBox='0 0 700 380'><g class='pulse-in' style='animation-delay:0.1s'><text x='150' y='100' font-size='48' text-anchor='middle'>🏠</text><text x='150' y='140' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Buildings</text></g><g class='pulse-in' style='animation-delay:0.3s'><text x='350' y='100' font-size='48' text-anchor='middle'>🌳</text><text x='350' y='140' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Green Spaces</text></g><g class='pulse-in' style='animation-delay:0.5s'><text x='550' y='100' font-size='48' text-anchor='middle'>🚗</text><text x='550' y='140' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Roads</text></g><g class='draw' style='animation-delay:0.7s'><line x1='150' y1='160' x2='150' y2='220' stroke='#cbbfa9' stroke-width='1.5'/><line x1='350' y1='160' x2='350' y2='220' stroke='#cbbfa9' stroke-width='1.5'/><line x1='550' y1='160' x2='550' y2='220' stroke='#cbbfa9' stroke-width='1.5'/></g><g class='scale-up' style='animation-delay:0.9s'><rect x='100' y='220' width='500' height='80' rx='10' fill='rgba(201,96,63,0.08)'/><text x='350' y='265' font-size='48' text-anchor='middle'>🗺️</text><text x='350' y='300' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>GIS Map Layers</text></g><g class='draw' style='animation-delay:1.1s'><line x1='350' y1='310' x2='350' y2='340' stroke='#cbbfa9' stroke-width='2'/><polygon points='345,340 350,355 355,340' fill='var(--teal)'/></g><g class='pulse-in' style='animation-delay:1.3s'><text x='350' y='320' font-size='40' text-anchor='middle'></text><text x='350' y='360' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Urban Planning Decisions</text></g></svg></div></div>
<div class="scene-wrap" data-narration="Together, remote sensing and GIS form a powerful duo, enabling us to monitor environmental changes, manage natural resources, and respond to disasters more effectively. This geospatial intelligence is vital for a sustainable and informed future." data-duration="10000" role="tabpanel" aria-label="Scene 5"><h2>A Powerful Duo for a Smarter World</h2><div class="art" role="img" aria-label="Visual diagram for scene 5"><svg viewBox='0 0 700 380'><g class='pulse-in' style='animation-delay:0.1s'><text x='150' y='175' font-size='52' text-anchor='middle'>🛰️</text><text x='150' y='215' font-size='14' fill='var(--ink)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Remote Sensing</text></g><g class='draw' style='animation-delay:0.3s'><path d='M200,175 Q280,120 350,175' stroke='#cbbfa9' stroke-width='2' fill='none'/><polygon points='350,170 365,175 350,180' fill='var(--teal)'/></g><g class='pulse-in' style='animation-delay:0.5s'><text x='350' y='175' font-size='52' text-anchor='middle'>🔗</text><text x='350' y='215' font-size='14' fill='var(--ink)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Integration</text></g><g class='draw' style='animation-delay:0.7s'><path d='M400,175 Q470,230 550,175' stroke='#cbbfa9' stroke-width='2' fill='none'/><polygon points='550,170 565,175 550,180' fill='var(--teal)'/></g><g class='pulse-in' style='animation-delay:0.9s'><text x='550' y='175' font-size='52' text-anchor='middle'>🗺️</text><text x='550' y='215' font-size='14' fill='var(--ink)' text-anchor='middle' font-family='Spline Sans,sans-serif'>GIS</text></g><g class='draw' style='animation-delay:1.1s'><line x1='350' y1='230' x2='350' y2='290' stroke='#cbbfa9' stroke-width='2'/><polygon points='345,290 350,305 355,290' fill='var(--teal)'/></g><g class='pulse-in' style='animation-delay:1.3s'><text x='350' y='325' font-size='48' text-anchor='middle'>🌍</text><text x='350' y='365' font-size='14' fill='var(--ink)' text-anchor='middle' fo
