<div id="scene-container" role="group" aria-label="Scenes"><div class="scene-wrap active" data-narration="Computational Fluid Dynamics (CFD) digitally simulates how liquids and gases move, offering insights into complex behaviors like air flowing over a wing or water in a pipe. This saves billions in physical testing, accelerating innovation across industries." data-duration="12000" role="tabpanel" aria-label="Scene 1"><h1>Simulating Fluid Motion</h1><div class="art" role="img" aria-label="Visual diagram for scene 1"><svg viewBox='0 0 700 380' xmlns='http://www.w3.org/2000/svg'><g class='scale-up' style='animation-delay:0.1s'><text x='350' y='175' font-size='52' text-anchor='middle'>💻</text><text x='350' y='215' font-size='14' fill='var(--ink)' text-anchor='middle' font-family='Spline Sans,sans-serif'>CFD Core</text></g><g class='draw' style='animation-delay:0.4s'><line x1="310" y1="140" x2="200" y2="90" stroke='#cbbfa9' stroke-width='1.5'/><line x1="390" y1="140" x2="500" y2="90" stroke='#cbbfa9' stroke-width='1.5'/><line x1="310" y1="200" x2="180" y2="270" stroke='#cbbfa9' stroke-width='1.5'/></g><g class='pulse-in' style='animation-delay:0.6s'><text x='180' y='80' font-size='36' text-anchor='middle'>🌊</text><text x='180' y='105' font-size='11' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Liquids</text></g><g class='pulse-in' style='animation-delay:0.7s'><text x='520' y='80' font-size='36' text-anchor='middle'>💨</text><text x='520' y='105' font-size='11' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Gases</text></g><g class='pulse-in' style='animation-delay:0.8s'><text x='160' y='275' font-size='36' text-anchor='middle'>🚀</text><text x='160' y='300' font-size='11' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Innovation</text></g></svg></div></div>
<div class="scene-wrap" data-narration="CFD works by dividing a continuous fluid domain into millions of tiny, discrete &quot;mesh cells&quot;, like pixels in an image. Within each cell, fundamental physics equations are solved numerically to approximate fluid behavior." data-duration="9000" role="tabpanel" aria-label="Scene 2"><h2>Discretizing the Flow</h2><div class="art" role="img" aria-label="Visual diagram for scene 2"><svg viewBox='0 0 700 380' xmlns='http://www.w3.org/2000/svg'><g class='scale-up' style='animation-delay:0.1s'><rect x='100' y='60' width='500' height='260' rx='12' fill='rgba(47,125,119,0.08)' stroke='var(--teal)' stroke-width='1.5'/><text x='350' y='50' font-size='16' fill='var(--ink)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Fluid Domain</text></g><g class='pulse-in' style='animation-delay:0.3s'><text x='350' y='190' font-size='56' text-anchor='middle'>🌐</text></g><g class='fade-up' style='animation-delay:0.5s'><text x='250' y='120' font-size='36' text-anchor='middle'>🔲</text><text x='250' y='145' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Mesh Cell</text></g><g class='fade-up' style='animation-delay:0.6s'><text x='450' y='120' font-size='36' text-anchor='middle'>🔲</text><text x='450' y='145' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Mesh Cell</text></g><g class='fade-up' style='animation-delay:0.7s'><text x='350' y='270' font-size='36' text-anchor='middle'>🔲</text><text x='350' y='295' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Mesh Cell</text></g><g class='draw' style='animation-delay:0.8s'><line x1="350" y1="190" x2="350" y2="240" stroke='#cbbfa9' stroke-width='1.5' stroke-dasharray='4,2'/><line x1="350" y1="190" x2="270" y2="140" stroke='#cbbfa9' stroke-width='1.5' stroke-dasharray='4,2'/><line x1="350" y1="190" x2="430" y2="140" stroke='#cbbfa9' stroke-width='1.5' <div class="scene-wrap" data-narration="At its heart, CFD solves the Navier-Stokes equations, which describe fluid motion, alongside conservation laws for mass and energy. These complex partial differential equations are approximated and solved iteratively for each mesh cell." data-duration="10000" role="tabpanel" aria-label="Scene 3"><h2>Governing Equations</h2><div class="art" role="img" aria-label="Visual diagram for scene 3"><svg viewBox='0 0 700 380' xmlns='http://www.w3.org/2000/svg'><g class='pulse-in' style='animation-delay:0.1s'><text x='150' y='160' font-size='48' text-anchor='middle'>📝</text><text x='150' y='200' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Navier-Stokes</text></g><g class='pulse-in' style='animation-delay:0.3s'><text x='250' y='260' font-size='48' text-anchor='middle'>⚖️</text><text x='250' y='300' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Conservation Laws</text></g><g class='draw' style='animation-delay:0.5s'><path d="M180,180 Q250,190 320,180" stroke='#cbbfa9' stroke-width='2' fill='none'/><polygon points='320,175 335,180 320,185' fill='var(--teal)'/><path d="M280,270 Q350,260 368,270" stroke='#cbbfa9' stroke-width='2' fill='none'/><polygon points='420,265 435,270 420,275' fill='var(--teal)'/></g><g class='pulse-in' style='animation-delay:0.7s'><text x='480' y='190' font-size='52' text-anchor='middle'>🧮</text><text x='480' y='230' font-size='14' fill='var(--ink)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Numerical Solver</text></g><g class='float' style='animation-delay:0.9s'><text x='580' y='100' font-size='36' text-anchor='middle'>🔄</text><text x='580' y='125' font-size='11' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Iteration</text></g></svg></div></div>
<div class="scene-wrap" data-narration="In automotive design, CFD simulates airflow over vehicles, identifying areas of high drag or lift. Engineers use these virtual wind tunnels to optimize car shapes, improving fuel efficiency by up to 15% without costly physical prototypes." data-duration="10000" role="tabpanel" aria-label="Scene 4"><h2>Optimizing Aerodynamics</h2><div class="art" role="img" aria-label="Visual diagram for scene 4"><svg viewBox='0 0 700 380' xmlns='http://www.w3.org/2000/svg'><g class='pulse-in' style='animation-delay:0.1s'><text x='350' y='200' font-size='56' text-anchor='middle'>🚗</text><text x='350' y='240' font-size='14' fill='var(--ink)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Vehicle Design</text></g><g class='draw' style='animation-delay:0.3s'><path d="M80,100 C150,80 250,80 350,100" stroke='#cbbfa9' stroke-width='2' fill='none'/><path d="M80,150 C150,130 250,130 350,150" stroke='#cbbfa9' stroke-width='2' fill='none'/><path d="M80,200 C150,180 250,180 350,200" stroke='#cbbfa9' stroke-width='2' fill='none'/></g><g class='pulse-in' style='animation-delay:0.5s'><text x='100' y='100' font-size='36' text-anchor='middle'>💨</text><text x='100' y='150' font-size='36' text-anchor='middle'>💨</text><text x='100' y='200' font-size='36' text-anchor='middle'>💨</text><text x='100' y='230' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Airflow</text></g><g class='draw' style='animation-delay:0.7s'><path d="M400,100 C500,120 368,120 368,150" stroke='#cbbfa9' stroke-width='2' fill='none'/><path d="M400,150 C500,170 368,170 368,200" stroke='#cbbfa9' stroke-width='2' fill='none'/><path d="M400,200 C500,220 368,220 368,250" stroke='#cbbfa9' stroke-width='2' fill='none'/><polygon points='620,145 635,150 620,155' fill='var(--teal)'/><polygon points='620,195 635,200 620,205' fill='var(--teal)'/><polygon points='620,245 635,250 620,255' fill='var(--teal)'/></g><g class='pulse-in' style='animation-delay:0.9s'><text x='620' y='100' font-size='48' text-anchor='middle'>📈</text><text x='620' y='135' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Optimization</text><text x='620' y='290' font-size='48' text-anchor='middle'>⛽</text><text x='620' y='325' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Efficiency</text></g></svg></div></div>
