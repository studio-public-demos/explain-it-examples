<div id="scene-container" role="group" aria-label="Scenes"><div class="scene-wrap active" data-narration="Compound interest is when your earnings start earning money too, creating a powerful snowball effect. It's often called 'interest on interest' and can turn small savings into substantial wealth over time." data-duration="10000" role="tabpanel" aria-label="Scene 1"><h1>The Magic of Compound Interest</h1><div class="art" role="img" aria-label="Visual diagram for scene 1"><svg viewBox='0 0 700 380'><g class='pulse-in' style='animation-delay:0.1s'><text x='150' y='160' font-size='48' text-anchor='middle'>💰</text><text x='150' y='200' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Principal</text></g><g class='draw' style='animation-delay:0.3s'><line x1="180" y1="155" x2="280" y2="155" stroke='#cbbfa9' stroke-width='2'/><polygon points='280,150 295,155 280,160' fill='var(--teal)'/></g><g class='fade-up' style='animation-delay:0.5s'><text x='350' y='160' font-size='44' text-anchor='middle'>➕</text><text x='350' y='200' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Interest</text></g><g class='draw' style='animation-delay:0.7s'><line x1="405" y1="155" x2="510" y2="155" stroke='#cbbfa9' stroke-width='2'/><polygon points='510,150 525,155 510,160' fill='var(--teal)'/></g><g class='pulse-in' style='animation-delay:0.9s'><text x='580' y='160' font-size='48' text-anchor='middle'>📈</text><text x='580' y='200' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Growth</text></g><g class='draw' style='animation-delay:1.1s'><path d="M580,220 C650,260 368,260 368,300" stroke='var(--teal)' stroke-width='1.5' fill='none' marker-end='url(#arrowhead)'/><path d="M580,220 C450,260 368,260 150,300" stroke='var(--teal)' stroke-width='1.5' fill='none' marker-end='url(#arrowhead)'/></g><g class='fade-up' style='animation-delay:1.3s'><text x='150' y= <div class="scene-wrap" data-narration="Unlike simple interest, which only calculates returns on the initial principal, compound interest adds earned interest back to the principal. This means your investment base continuously grows, accelerating wealth accumulation." data-duration="12000" role="tabpanel" aria-label="Scene 2"><h2>Simple vs. Compound: The Key Difference</h2><div class="art" role="img" aria-label="Visual diagram for scene 2"><svg viewBox='0 0 700 380'><g class='fade-up' style='animation-delay:0.1s'><rect x='80' y='60' rx='10' ry='10' width='250' height='260' fill='rgba(47,125,119,0.08)'/></g><g class='pulse-in' style='animation-delay:0.3s'><text x='205' y='100' font-size='36' text-anchor='middle'>➖</text><text x='205' y='130' font-size='16' fill='var(--ink)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Simple Interest</text></g><g class='pulse-in' style='animation-delay:0.5s'><text x='205' y='180' font-size='48' text-anchor='middle'>💰</text><text x='205' y='220' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Principal</text></g><g class='pulse-in' style='animation-delay:0.7s'><text x='205' y='270' font-size='36' text-anchor='middle'>➕</text><text x='205' y='300' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Fixed Interest</text></g><g class='fade-up' style='animation-delay:0.2s'><rect x='370' y='60' rx='10' ry='10' width='250' height='260' fill='rgba(201,96,63,0.08)'/></g><g class='pulse-in' style='animation-delay:0.4s'><text x='495' y='100' font-size='36' text-anchor='middle'>➕➕</text><text x='495' y='130' font-size='16' fill='var(--ink)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Compound Interest</text></g><g class='pulse-in' style='animation-delay:0.6s'><text x='495' y='180' font-size='48' text-anchor='middle'>💰</text><text x='495' y='220' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Principal</text></g><g class='pulse-in' style='animation-delay:0.8s'><text x='495' y='270' font-size='36' text-anchor='middle'>➕</text><text x='495' y='300' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Growing Interest</text></g></svg></div></div>
<div class="scene-wrap" data-narration="The formula A = P(1 + r/n)^(nt) shows how principal (P), rate (r), time (t), and compounding frequency (n) determine the final amount (A). The more frequent the compounding, the faster your money grows." data-duration="12000" role="tabpanel" aria-label="Scene 3"><h2>The Compounding Formula</h2><div class="art" role="img" aria-label="Visual diagram for scene 3"><svg viewBox='0 0 700 380'><g class='pulse-in' style='animation-delay:0.1s'><text x='100' y='100' font-size='48' text-anchor='middle'>💰</text><text x='100' y='140' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>P (Principal)</text></g><g class='pulse-in' style='animation-delay:0.3s'><text x='250' y='100' font-size='48' text-anchor='middle'>%</text><text x='250' y='140' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>r (Rate)</text></g><g class='pulse-in' style='animation-delay:0.5s'><text x='400' y='100' font-size='48' text-anchor='middle'>⏱️</text><text x='400' y='140' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>t (Time)</text></g><g class='pulse-in' style='animation-delay:0.7s'><text x='550' y='100' font-size='48' text-anchor='middle'>🗓️</text><text x='550' y='140' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>n (Frequency)</text></g><g class='draw' style='animation-delay:0.9s'><path d="M100,160 C200,200 368,200 368,160" stroke='#cbbfa9' stroke-width='2' fill='none'/></g><g class='fade-up' style='animation-delay:1.1s'><text x='350' y='250' font-size='24' fill='var(--ink)' text-anchor='middle' font-family='Spline Sans,sans-serif'>A = P(1 + r/n)^(nt)</text></g><g class='pulse-in' style='animation-delay:1.3s'><text x='350' y='300' font-size='48' text-anchor='middle'>📈</text><text x='350' y='340' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline San <div class="scene-wrap" data-narration="A common application is retirement savings, where early investments benefit significantly from compounding. For example, $10,000 invested at 7% annual interest for 30 years could grow to over $76,000, illustrating the power of time." data-duration="12000" role="tabpanel" aria-label="Scene 4"><h2>Real-World Impact: Retirement Savings</h2><div class="art" role="img" aria-label="Visual diagram for scene 4"><svg viewBox='0 0 700 380'><g class='pulse-in' style='animation-delay:0.1s'><text x='100' y='100' font-size='48' text-anchor='middle'>👶</text><text x='100' y='140' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Start Early</text></g><g class='draw' style='animation-delay:0.3s'><line x1="130" y1="100" x2="200" y2="100" stroke='#cbbfa9' stroke-width='2'/><polygon points='200,95 215,100 200,105' fill='var(--teal)'/></g><g class='pulse-in' style='animation-delay:0.5s'><text x='250' y='100' font-size='48' text-anchor='middle'>💰</text><text x='250' y='140' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Initial Investment</text></g><g class='draw' style='animation-delay:0.7s'><path d="M280,100 C350,150 368,150 368,100" stroke='#cbbfa9' stroke-width='2' fill='none'/><polygon points='520,95 535,100 520,105' fill='var(--teal)'/></g><g class='pulse-in' style='animation-delay:0.9s'><text x='580' y='100' font-size='48' text-anchor='middle'>👴</text><text x='580' y='140' font-size='13' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>Retirement</text></g><g class='fade-up' style='animation-delay:1.1s'><rect x='100' y='200' rx='8' ry='8' width='500' height='100' fill='rgba(47,125,119,0.08)'/></g><g class='pulse-in' style='animation-delay:1.3s'><text x='350' y='250' font-size='20' fill='var(--ink)' text-anchor='middle' font-family='Spline Sans,sans-serif'><title>$10,000 @ 7% for 30 years ➡️ $76,122</title>$10,000 @ 7 ;</title>"Compound interest is the eighth wonder of the world."</text></g><g class='fade-up' style='animation-delay:1.5s'><text x='350' y='270' font-size='16' fill='var(--ink-soft)' text-anchor='middle' font-family='Spline Sans,sans-serif'>- Albert Einstein</text></g></svg></div></div></div>
